services:
  collector:
    build: .
    command: python -m app.collector
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build: .
    command: python -m app.web
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "${PORT:-18743}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
